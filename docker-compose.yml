services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nivara
      POSTGRES_USER: nivara
      POSTGRES_PASSWORD: nivara
    ports:
      - "5432:5432"
    volumes:
      - nivara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivara -d nivara"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nivara-postgres-data:
